<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparaison de textes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      margin-top: 0;
    }

    .zones,
    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    textarea {
      min-height: 17rem;
      padding: 0.65rem;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95rem;
      line-height: 1.35;
      tab-size: 2;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    button {
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }

    .summary {
      min-height: 1.5rem;
      margin: 0 0 0.75rem;
      font-weight: bold;
    }

    .identical {
      color: #218739;
    }

    .different {
      color: #bd2020;
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .result-heading h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .results textarea {
      min-height: 12rem;
    }

    @media (max-width: 800px) {
      .zones,
      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Comparaison de deux textes</h1>

  <div class="zones">
    <label class="field" for="text-left">
      <strong>Texte 1</strong>
      <textarea id="text-left" autofocus spellcheck="false" placeholder="Coller le premier texte ici..."></textarea>
    </label>
    <label class="field" for="text-right">
      <strong>Texte 2</strong>
      <textarea id="text-right" spellcheck="false" placeholder="Coller le second texte ici..."></textarea>
    </label>
  </div>

  <div class="toolbar">
    <button type="button" id="compare">Comparer</button>
    <button type="button" id="swap">Inverser les textes</button>
    <button type="button" id="clear">Effacer</button>
    <label><input id="ignore-empty" type="checkbox" checked> Ignorer les lignes vides</label>
    <label><input id="trim-lines" type="checkbox"> Ignorer les espaces en d&eacute;but et fin</label>
  </div>

  <p id="summary" class="summary" aria-live="polite">Saisir les deux textes puis cliquer sur Comparer.</p>

  <div class="results">
    <div class="field">
      <div class="result-heading">
        <h2>Uniquement dans le texte 1</h2>
        <button type="button" data-copy="only-left">Copier</button>
      </div>
      <textarea id="only-left" readonly spellcheck="false"></textarea>
    </div>
    <div class="field">
      <div class="result-heading">
        <h2>Uniquement dans le texte 2</h2>
        <button type="button" data-copy="only-right">Copier</button>
      </div>
      <textarea id="only-right" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <script>
    const textLeft = document.getElementById('text-left');
    const textRight = document.getElementById('text-right');
    const onlyLeft = document.getElementById('only-left');
    const onlyRight = document.getElementById('only-right');
    const summary = document.getElementById('summary');
    const ignoreEmpty = document.getElementById('ignore-empty');
    const trimLines = document.getElementById('trim-lines');

    function splitLines(text) {
      const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
      return ignoreEmpty.checked ? lines.filter((line) => line.trim() !== '') : lines;
    }

    function comparisonKey(line) {
      const key = trimLines.checked ? line.trim() : line;
      return key
        .toLocaleLowerCase('fr')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function groupLines(lines) {
      const groups = new Map();
      for (const line of lines) {
        const key = comparisonKey(line);
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(line);
      }
      return groups;
    }

    function compareTexts() {
      const leftLines = splitLines(textLeft.value);
      const rightLines = splitLines(textRight.value);
      const leftGroups = groupLines(leftLines);
      const rightGroups = groupLines(rightLines);
      const keys = new Set([...leftGroups.keys(), ...rightGroups.keys()]);
      const leftDifferences = [];
      const rightDifferences = [];
      let commonCount = 0;

      for (const key of keys) {
        const leftValues = leftGroups.get(key) || [];
        const rightValues = rightGroups.get(key) || [];
        const shared = Math.min(leftValues.length, rightValues.length);
        commonCount += shared;
        leftDifferences.push(...leftValues.slice(shared));
        rightDifferences.push(...rightValues.slice(shared));
      }

      onlyLeft.value = leftDifferences.join('\n');
      onlyRight.value = rightDifferences.join('\n');

      const identical = leftDifferences.length === 0 && rightDifferences.length === 0;
      summary.className = `summary ${identical ? 'identical' : 'different'}`;
      summary.textContent = identical
        ? `Textes identiques (${commonCount} ligne${commonCount > 1 ? 's' : ''}).`
        : `${commonCount} ligne(s) commune(s) ; ${leftDifferences.length} uniquement dans le texte 1 ; ${rightDifferences.length} uniquement dans le texte 2.`;
    }

    document.getElementById('compare').addEventListener('click', compareTexts);

    document.getElementById('swap').addEventListener('click', () => {
      const previousLeft = textLeft.value;
      textLeft.value = textRight.value;
      textRight.value = previousLeft;
      compareTexts();
    });

    document.getElementById('clear').addEventListener('click', () => {
      textLeft.value = '';
      textRight.value = '';
      onlyLeft.value = '';
      onlyRight.value = '';
      summary.className = 'summary';
      summary.textContent = 'Saisir les deux textes puis cliquer sur Comparer.';
      textLeft.focus();
    });

    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', async () => {
        const target = document.getElementById(button.dataset.copy);
        try {
          await navigator.clipboard.writeText(target.value);
          const originalLabel = button.textContent;
          button.textContent = 'Copi\u00e9';
          setTimeout(() => {
            button.textContent = originalLabel;
          }, 1200);
        } catch (error) {
          target.select();
          document.execCommand('copy');
        }
      });
    });

    [ignoreEmpty, trimLines].forEach((option) => {
      option.addEventListener('change', compareTexts);
    });

    [textLeft, textRight].forEach((textarea) => {
      textarea.addEventListener('keydown', (event) => {
        if (event.ctrlKey && event.key === 'Enter') {
          compareTexts();
        }
      });
    });
  </script>
</body>
</html>
